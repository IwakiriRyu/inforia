<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Inforia</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f1f4d" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Inforia" />
</head>
<body class="splash-body">
<main class="splash" id="splash" role="button" tabindex="0" aria-label="タップして始める">
  <div class="fx-bg" id="fxBg" aria-hidden="true"></div>
  <div class="splash-center">
    <img class="splash-icon" src="assets/icon.svg" alt="" width="104" height="104" />
    <h1 class="splash-logo">Inforia</h1>
    <p class="splash-tagline">情報Iを楽しく、続けられる学習体験を。</p>
  </div>
  <div class="splash-tap">タップして始める</div>
</main>

<script src="js/pwa.js"></script>
<script src="js/auth.js"></script>
<script src="js/fx-bg.js"></script>
<script>
  // 以前ログインした端末なら、そのままホームへ。初めてならログイン画面へ。
  function startApp() {
    window.location.href = currentUserEmail() ? "home.html" : "login.html";
  }
  const splash = document.getElementById("splash");
  splash.addEventListener("click", startApp);
  splash.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      startApp();
    }
  });
</script>
</body>
</html>
